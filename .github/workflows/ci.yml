name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: karatarkhis_test
          POSTGRES_USER: karatarkhis
          POSTGRES_PASSWORD: karatarkhis_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U karatarkhis -d karatarkhis_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://karatarkhis:karatarkhis_test_only@localhost:5432/karatarkhis_test
      KRT_TEST_DATABASE_URL: postgresql+psycopg://karatarkhis:karatarkhis_test_only@localhost:5432/karatarkhis_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Syntax and import check
        working-directory: backend
        run: python -m compileall -q app tests && python -c "import app.main"
      - name: Validate migrations from zero to head
        working-directory: backend
        run: alembic downgrade base && alembic upgrade head && alembic current --check-heads
      - name: Run backend regression suite
        working-directory: backend
        run: pytest
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
