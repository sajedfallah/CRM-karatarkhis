<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حساب کاراترخیص</title>
  <link rel="stylesheet" href="/auth-assets/auth.css">
  <script src="/auth-assets/auth.js" defer></script>
</head>
<body>
  <main>
    <header><p class="brand">کاراترخیص</p><p>سامانه مدیریت عملیات ترخیص</p></header>
    <section aria-labelledby="title">
      <h1 id="title">حساب کاربری</h1>
      <p id="intro"></p>
      <form id="activate" hidden>
        <label for="full-name">نام و نام خانوادگی</label>
        <input id="full-name" name="full_name" autocomplete="name" minlength="2" maxlength="255" required>
        <label for="new-password">رمز جدید — حداقل ۱۲ نویسه</label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <label for="confirm-password">تکرار رمز</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
        <button type="submit">تأیید ایمیل و فعال‌سازی حساب</button>
      </form>
      <form id="login" hidden>
        <label for="email">ایمیل</label>
        <input id="email" name="email" type="email" dir="ltr" autocomplete="username" maxlength="320" required>
        <label for="password">رمز عبور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        <button type="submit">ورود</button>
      </form>
      <div id="account" hidden><p id="identity"></p><a href="/app">باز کردن پنل عملیات</a><button id="logout" type="button">خروج از حساب</button></div>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="login-link" href="/login" hidden>رفتن به صفحه ورود</a>
    </section>
    <footer>کاراترخیص · محیط آزمایشی</footer>
  </main>
</body>
</html>
